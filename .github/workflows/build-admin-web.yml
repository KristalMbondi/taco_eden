name: Build Admin Web

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/admin_web/**'
      - '.github/workflows/build-admin-web.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - working-directory: apps/admin_web
        run: |
          if [ ! -d web ]; then flutter create . --platforms=web; else echo "web exists - skip create"; fi
          flutter pub get
          flutter analyze || echo "warnings ok"
          flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: taco-eden-admin-web
          path: apps/admin_web/build/web
