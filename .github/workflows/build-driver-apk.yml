name: Build Driver APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/driver/**'
      - '.github/workflows/build-driver-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'
          cache: true
      - working-directory: apps/driver
        run: |
          flutter create . --platforms=android --overwrite
          flutter pub get
          flutter analyze || echo "warnings ok"
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: taco-eden-driver-apk
          path: apps/driver/build/app/outputs/flutter-apk/app-release.apk

